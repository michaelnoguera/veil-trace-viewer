<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The security policy of the page. A result that a person opens is data from
  an unknown source, so the page gives it nothing to work with:
    default-src 'none'   no request to a server: no image, font, frame, worker
    connect-src          fetch, to load a result from a link. The script asks
                         first when the link came with the page (?url=).
    script-src  (hash)   only the script of this file runs. No other inline
                         script, no script from a URL, no eval.
    style-src            inline styles only (Veil's display adds its own)
    base-uri, form-action 'none'
  The build puts the hash of the script in place of __SCRIPT_HASH__.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https: http:; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Veil trace viewer</title>
<!--
  Shows the result of a Veil model check in a browser. No server; the only
  network request loads a result from a link, when a person asks for one.

  The trace is drawn by Veil's own component (widget/src/traceDisplay.tsx of
  https://github.com/verse-lab/veil, Apache-2.0), bundled with React (MIT).
  This file is generated by build.mjs from src/. Do not edit it by hand.
-->
<style data-static>
  /* Veil's component uses the colours of the VS Code theme. A browser has
     none, so these are the values of the default light and dark themes. */
  :root {
    --vscode-font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --vscode-foreground: #3b3b3b;
    --vscode-descriptionForeground: #6b6b6b;
    --vscode-editor-foreground: #1f1f1f;
    --vscode-editor-background: #ffffff;
    --vscode-editorWidget-background: #f8f8f8;
    --vscode-editorGroupHeader-tabsBackground: #f3f3f3;
    --vscode-panel-border: rgba(128, 128, 128, 0.35);
    --vscode-focusBorder: #005fb8;
    --vscode-textLink-foreground: #005fb8;
    --vscode-list-hoverBackground: #f0f0f0;
    --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
    --vscode-activityBarBadge-background: #005fb8;
    --vscode-activityBarBadge-foreground: #ffffff;
    --vscode-button-background: #005fb8;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #0258a8;
    --vscode-inputValidation-errorBackground: #f2dede;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-inputValidation-errorForeground: #3b3b3b;
    --vscode-inputValidation-warningBackground: #f6f5d2;
    --vscode-inputValidation-warningBorder: #b89500;
    --vscode-inputValidation-warningForeground: #3b3b3b;
    --vscode-inputValidation-infoBackground: #d6ecf2;
    --vscode-inputValidation-infoBorder: #007acc;
    --vscode-inputValidation-infoForeground: #3b3b3b;
    --vscode-editorHoverWidget-background: #f8f8f8;
    --vscode-editorHoverWidget-foreground: #3b3b3b;
    --vscode-editorHoverWidget-border: #c8c8c8;
    --vscode-editor-selectionBackground: #add6ff;
    --vscode-editor-selectionHighlightBorder: transparent;
    --vscode-editor-findMatchHighlightBackground: rgba(234, 92, 0, 0.33);
    --vscode-editor-findMatchHighlightBorder: transparent;
    --vscode-diffEditor-insertedTextBackground: rgba(156, 204, 44, 0.25);
    --vscode-diffEditor-insertedLineBackground: rgba(155, 185, 85, 0.2);
    --vscode-diffEditor-removedTextBackground: rgba(255, 0, 0, 0.2);
    --vscode-diffEditor-removedLineBackground: rgba(255, 0, 0, 0.2);
    --vscode-notificationsInfoIcon-foreground: #1a85ff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-editor-foreground: #d4d4d4;
      --vscode-editor-background: #1e1e1e;
      --vscode-editorWidget-background: #252526;
      --vscode-editorGroupHeader-tabsBackground: #252526;
      --vscode-focusBorder: #007fd4;
      --vscode-textLink-foreground: #3794ff;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
      --vscode-activityBarBadge-background: #007acc;
      --vscode-button-background: #0e639c;
      --vscode-button-hoverBackground: #1177bb;
      --vscode-inputValidation-errorBackground: #5a1d1d;
      --vscode-inputValidation-errorForeground: #cccccc;
      --vscode-inputValidation-warningBackground: #352a05;
      --vscode-inputValidation-warningForeground: #cccccc;
      --vscode-inputValidation-infoBackground: #063b49;
      --vscode-inputValidation-infoForeground: #cccccc;
      --vscode-editorHoverWidget-background: #252526;
      --vscode-editorHoverWidget-foreground: #cccccc;
      --vscode-editorHoverWidget-border: #454545;
      --vscode-editor-selectionBackground: #264f78;
      --vscode-diffEditor-insertedTextBackground: rgba(156, 204, 44, 0.2);
      --vscode-notificationsInfoIcon-foreground: #3794ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
    line-height: 1.4;
  }
  header.bar {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--vscode-panel-border);
    background: var(--vscode-editorGroupHeader-tabsBackground);
  }
  header.bar h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header.bar .name {
    font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-descriptionForeground); overflow-wrap: anywhere;
  }
  header.bar .spacer { flex: 1; }
  header.bar button, header.bar label.btn, header.bar select {
    font: inherit; font-size: 12px; color: var(--vscode-foreground);
    background: var(--vscode-editor-background);
    border: 1px solid var(--vscode-panel-border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer;
  }
  header.bar select { padding: 3px 6px; }
  header.bar button:hover:not(:disabled), header.bar label.btn:hover { border-color: var(--vscode-focusBorder); }
  header.bar button:disabled { opacity: .5; cursor: default; }
  header.bar button:focus-visible, header.bar label.btn:focus-within, header.bar select:focus-visible {
    outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px;
  }
  header.bar label.pick { font-size: 12px; color: var(--vscode-descriptionForeground); }
  header.bar input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  main { padding: 12px 16px; }
  .empty {
    border: 2px dashed var(--vscode-panel-border); border-radius: 8px;
    padding: 48px 20px; text-align: center; color: var(--vscode-descriptionForeground);
  }
  .empty.over { border-color: var(--vscode-focusBorder); background: var(--vscode-list-hoverBackground); }
  .error {
    background: var(--vscode-inputValidation-errorBackground);
    border: 1px solid var(--vscode-inputValidation-errorBorder);
    border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; overflow-wrap: anywhere;
  }
  .note {
    font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-descriptionForeground); margin-bottom: 8px; overflow-wrap: anywhere;
  }
  .paste { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .paste textarea {
    width: 100%; min-height: 200px; resize: vertical; padding: 8px;
    font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-editor-foreground); background: var(--vscode-editorWidget-background);
    border: 1px solid var(--vscode-panel-border); border-radius: 4px;
  }
  .paste textarea:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px; }
  .paste .actions, .confirm .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .paste .hint { font-size: 12px; color: var(--vscode-descriptionForeground); margin-right: auto; align-self: center; }
  .confirm {
    background: var(--vscode-inputValidation-warningBackground);
    border: 1px solid var(--vscode-inputValidation-warningBorder);
    color: var(--vscode-inputValidation-warningForeground);
    border-radius: 4px; padding: 12px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .confirm p { margin: 0; }
  .confirm code {
    font-family: var(--vscode-editor-font-family); font-size: 12px; overflow-wrap: anywhere;
  }
  .confirm strong.host { font-family: var(--vscode-editor-font-family); }
  .paste button, .confirm button {
    font: inherit; font-size: 12px; border-radius: 4px; padding: 4px 12px; cursor: pointer;
    color: var(--vscode-foreground); background: var(--vscode-editor-background);
    border: 1px solid var(--vscode-panel-border);
  }
  .paste button.primary, .confirm button.primary {
    color: var(--vscode-button-foreground); background: var(--vscode-button-background);
    border-color: var(--vscode-button-background);
  }
  .paste button.primary:hover:not(:disabled), .confirm button.primary:hover { background: var(--vscode-button-hoverBackground); }
  .paste button:disabled { opacity: .5; cursor: default; }
  @media print { header.bar button, header.bar label, .paste { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="veil-data"></script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
