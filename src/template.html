<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The security policy of the page. A result that a person opens is data from
  an unknown source, so the page gives it nothing to work with:
    default-src 'none'   no request to a server: no image, font, frame, worker
    connect-src          fetch, to load a result from a link. The script asks
                         first when the link came with the page (?url=).
    script-src  (hash)   only the script of this file runs. No other inline
                         script, no script from a URL, no eval.
    style-src            inline styles only (Veil's display adds its own)
    base-uri, form-action 'none'
  The build puts the hash of the script in place of __SCRIPT_HASH__.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https: http:; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Veil Trace Viewer</title>
<!--
  Shows the result of a Veil model check in a browser. No server; the only
  network request loads a result from a link, when a person asks for one.

  The trace is drawn by Veil's own component (widget/src/traceDisplay.tsx of
  https://github.com/verse-lab/veil, Apache-2.0), bundled with React (MIT).
  This file is generated by build.mjs from src/. Do not edit it by hand.
-->
<style data-static>
  /* Veil's component uses the colours of the VS Code theme. A browser has
     none, so these are the values of GitHub Light Default and GitHub Dark
     Default (themes/light-default.json and dark-default.json of GitHub's
     VS Code theme, version 6.3.5). Where a theme sets no value, VS Code uses
     its built-in default for light or dark themes, and so does this page:
     the lines marked "default". Only the variables that Veil's display or
     this page use are here. */
  :root {
    --vscode-font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* GitHub Light Default */
    --vscode-foreground: #1f2328;
    --vscode-descriptionForeground: #656d76;
    --vscode-editor-foreground: #1f2328;
    --vscode-editor-background: #ffffff;
    --vscode-editorWidget-background: #ffffff;
    --vscode-editorGroupHeader-tabsBackground: #f6f8fa;
    --vscode-panel-border: #d0d7de;
    --vscode-focusBorder: #0969da;
    --vscode-textLink-foreground: #0969da;
    --vscode-list-hoverBackground: #eaeef280;
    --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31); /* default */
    --vscode-activityBarBadge-background: #0969da;
    --vscode-activityBarBadge-foreground: #ffffff;
    --vscode-button-background: #1f883d;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #1a7f37;
    /* Error, warning and info: the theme sets none, so VS Code would use its
       defaults (#f2dede/#be1100, #f6f5d2/#b89500, #d6ecf2/#007acc). These
       are instead the colours of GitHub's own alerts (Primer: the subtle
       colour as fill, the muted colour as border). */
    --vscode-inputValidation-errorBackground: #ffebe9;
    --vscode-inputValidation-errorBorder: rgba(255, 129, 130, 0.4);
    --vscode-inputValidation-warningBackground: #fff8c5;
    --vscode-inputValidation-warningBorder: rgba(212, 167, 44, 0.4);
    --vscode-inputValidation-infoBackground: #ddf4ff;
    --vscode-inputValidation-infoBorder: rgba(84, 174, 255, 0.4);
    --vscode-editorHoverWidget-background: #ffffff; /* default: the widget background */
    --vscode-editorHoverWidget-foreground: #1f2328; /* default: the foreground */
    --vscode-editorHoverWidget-border: #c8c8c8; /* default */
    --vscode-editor-selectionBackground: #add6ff; /* default */
    --vscode-editor-selectionHighlightBorder: transparent; /* unset */
    --vscode-editor-findMatchHighlightBackground: #fae17d80;
    --vscode-editor-findMatchHighlightBorder: transparent; /* unset */
    /* Changed values. The theme's colours are translucent (#6fdd8b80,
       #ff818266), so on a changed row they would mix with its yellow. These
       are the same colours made solid, as they look on the card background,
       so that they look the same on any row. Veil's display draws a ring
       around a changed value in the line colours, which are transparent here
       to hide it (the theme has #aceebb4d and #ffcecb4d). */
    --vscode-diffEditor-insertedTextBackground: #b7eec5;
    --vscode-diffEditor-insertedLineBackground: transparent;
    --vscode-diffEditor-removedTextBackground: #ffcdcd;
    --vscode-diffEditor-removedLineBackground: transparent;
    --vscode-notificationsInfoIcon-foreground: #0969da;
    /* All the text of the page header: black, or white on the dark theme. */
    --header-foreground: #000000;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* GitHub Dark Default */
      --vscode-foreground: #e6edf3;
      --vscode-descriptionForeground: #7d8590;
      --vscode-editor-foreground: #e6edf3;
      --vscode-editor-background: #0d1117;
      --vscode-editorWidget-background: #161b22;
      --vscode-editorGroupHeader-tabsBackground: #010409;
      --vscode-panel-border: #30363d;
      --vscode-focusBorder: #1f6feb;
      --vscode-textLink-foreground: #2f81f7;
      --vscode-list-hoverBackground: #6e76811a;
      --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31); /* default */
      --vscode-activityBarBadge-background: #1f6feb;
      --vscode-activityBarBadge-foreground: #ffffff;
      --vscode-button-background: #238636;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #2ea043;
      /* GitHub's alerts, as for the light theme (VS Code's defaults would be
         #5a1d1d/#be1100, #352a05/#b89500, #063b49/#007acc). */
      --vscode-inputValidation-errorBackground: rgba(248, 81, 73, 0.1);
      --vscode-inputValidation-errorBorder: rgba(248, 81, 73, 0.4);
      --vscode-inputValidation-warningBackground: rgba(187, 128, 9, 0.15);
      --vscode-inputValidation-warningBorder: rgba(187, 128, 9, 0.4);
      --vscode-inputValidation-infoBackground: rgba(56, 139, 253, 0.1);
      --vscode-inputValidation-infoBorder: rgba(56, 139, 253, 0.4);
      --vscode-editorHoverWidget-background: #161b22; /* default: the widget background */
      --vscode-editorHoverWidget-foreground: #e6edf3; /* default: the foreground */
      --vscode-editorHoverWidget-border: #454545; /* default */
      --vscode-editor-selectionBackground: #264f78; /* default */
      --vscode-editor-selectionHighlightBorder: transparent; /* unset */
      /* Changed rows: a darker yellow than the theme's #f2cc6080, so that
         the text on them stays readable. */
      --vscode-editor-findMatchHighlightBackground: rgba(187, 128, 9, 0.25);
      --vscode-editor-findMatchHighlightBorder: transparent; /* unset */
      /* The theme's #3fb9504d and #ff7b724d made solid, and no ring, as for
         the light theme. */
      --vscode-diffEditor-insertedTextBackground: #224b30;
      --vscode-diffEditor-insertedLineBackground: transparent;
      --vscode-diffEditor-removedTextBackground: #5c383a;
      --vscode-diffEditor-removedLineBackground: transparent;
      --vscode-notificationsInfoIcon-foreground: #2f81f7;
      --header-foreground: #ffffff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
    line-height: 1.4;
  }
  header.bar {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--vscode-panel-border);
    background: var(--vscode-editor-background);
    color: var(--header-foreground);
  }
  header.bar h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header.bar .name {
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  header.bar .spacer { flex: 1; }
  /* The colours that Veil's display gives its own controls: a border of its
     panels and the hover of its toolbar links. */
  header.bar button, header.bar label.btn, header.bar select {
    font: inherit; font-size: 12px; color: inherit;
    background: transparent;
    border: 1px solid var(--vscode-panel-border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer;
  }
  header.bar select { padding: 3px 6px; background: var(--vscode-editor-background); }
  header.bar button:hover:not(:disabled), header.bar label.btn:hover, header.bar select:hover {
    background: var(--vscode-toolbar-hoverBackground);
  }
  header.bar button:disabled { opacity: .5; cursor: default; }
  header.bar button:focus-visible, header.bar label.btn:focus-within, header.bar select:focus-visible {
    outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px;
  }
  header.bar label.pick { font-size: 12px; }
  header.bar input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  /* The footer sits at the bottom of the window, or below the trace when it is longer. */
  #root { display: flex; flex-direction: column; min-height: 100vh; }
  /* No padding on main, so that Veil's toolbar starts right below the header.
     The page's own boxes keep the margins instead. */
  main { flex: 1; }
  .confirm, .paste, .error, .note, .empty { margin-left: 16px; margin-right: 16px; }
  main > :first-child:not(.trace) { margin-top: 12px; }
  main > .empty { margin-bottom: 12px; }
  footer.site {
    padding: 10px 16px; border-top: 1px solid var(--vscode-panel-border);
    background: var(--vscode-editor-background);
    font-size: 12px; color: var(--vscode-descriptionForeground); text-align: center;
  }
  footer.site a { color: var(--vscode-textLink-foreground); text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
  .empty {
    border: 2px dashed var(--vscode-panel-border); border-radius: 8px;
    padding: 48px 20px; text-align: center; color: var(--vscode-descriptionForeground);
  }
  .empty.over { border-color: var(--vscode-focusBorder); background: var(--vscode-list-hoverBackground); }
  .error {
    background: var(--vscode-inputValidation-errorBackground);
    border: 1px solid var(--vscode-inputValidation-errorBorder);
    color: var(--vscode-inputValidation-errorForeground, var(--vscode-foreground));
    border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; overflow-wrap: anywhere;
  }
  .note {
    font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-descriptionForeground); margin-bottom: 8px; overflow-wrap: anywhere;
  }
  .paste { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .paste textarea {
    width: 100%; min-height: 200px; resize: vertical; padding: 8px;
    font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-editor-foreground); background: var(--vscode-editorWidget-background);
    border: 1px solid var(--vscode-panel-border); border-radius: 4px;
  }
  .paste textarea:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px; }
  .paste .actions, .confirm .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .paste .hint { font-size: 12px; color: var(--vscode-descriptionForeground); margin-right: auto; align-self: center; }
  .confirm {
    background: var(--vscode-inputValidation-warningBackground);
    border: 1px solid var(--vscode-inputValidation-warningBorder);
    color: var(--vscode-inputValidation-warningForeground, var(--vscode-foreground));
    border-radius: 6px; padding: 12px 16px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .confirm p { margin: 0; }
  .confirm code {
    font-family: var(--vscode-editor-font-family); font-size: 12px; overflow-wrap: anywhere;
  }
  .confirm strong.host { font-family: var(--vscode-editor-font-family); }
  .paste button, .confirm button {
    font: inherit; font-size: 12px; border-radius: 4px; padding: 4px 12px; cursor: pointer;
    color: var(--vscode-foreground); background: var(--vscode-editor-background);
    border: 1px solid var(--vscode-panel-border);
  }
  .paste button.primary, .confirm button.primary {
    color: var(--vscode-button-foreground); background: var(--vscode-button-background);
    border-color: var(--vscode-button-background);
  }
  .paste button.primary:hover:not(:disabled), .confirm button.primary:hover { background: var(--vscode-button-hoverBackground); }
  .paste button:disabled { opacity: .5; cursor: default; }
  @media print { header.bar button, header.bar label, .paste { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="veil-data"></script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
